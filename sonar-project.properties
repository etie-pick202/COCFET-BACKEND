# Analyse SonarCloud — https://sonarcloud.io/project/overview?id=etie-pick202_COCFET-BACKEND
# Activée par la variable de dépôt SONAR_ENABLED=true et le secret SONAR_TOKEN
# (Settings > Secrets and variables > Actions).

sonar.projectKey=etie-pick202_COCFET-BACKEND
sonar.organization=etie-pick202
sonar.projectName=COCFET Backend

sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,test/**/*
# Entités et modules exclus : ce sont des déclarations (décorateurs, mapping ORM)
# sans logique à auditer ni à couvrir par des tests.
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**,**/*.entity.ts,**/*.module.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
