# Analyse SonarCloud — https://sonarcloud.io/project/overview?id=etie-pick202_COCFET-BACKEND
# Activée par la variable de dépôt SONAR_ENABLED=true et le secret SONAR_TOKEN
# (Settings > Secrets and variables > Actions).

sonar.projectKey=etie-pick202_COCFET-BACKEND
sonar.organization=etie-pick202
sonar.projectName=COCFET Backend

sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,test/**/*
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**
sonar.sourceEncoding=UTF-8

# Exclu de la *couverture* uniquement, pas de l'analyse : ces fichiers restent
# audités pour les vulnérabilités et les code smells, mais ne sont pas comptés
# dans le ratio de tests. Ce sont des déclarations (décorateurs, mapping ORM,
# constantes) sans logique à éprouver — les inclure diluerait la couverture
# réelle des services critiques.
# data-source.ts est un objet de configuration consomme par le CLI TypeORM :
# il ne contient aucune logique a eprouver.
sonar.coverage.exclusions=**/*.module.ts,**/*.dto.ts,**/*.entity.ts,**/*.enum.ts,**/*.decorator.ts,**/*constants.ts,**/main.ts,**/*.config.ts,**/migrations/**,**/data-source.ts

# Les migrations sont du SQL genere par TypeORM : repetitif par nature et sans
# logique a tester. Les mesurer fausserait couverture comme duplication.
sonar.cpd.exclusions=**/migrations/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
