# À activer une fois le projet créé sur https://sonarcloud.io
# 1. Créer un compte / organisation SonarCloud liée à GitHub (etie-pick202)
# 2. Importer ce dépôt comme nouveau projet
# 3. Ajouter le secret GitHub Actions SONAR_TOKEN (Settings > Secrets and variables > Actions)
# 4. Remplacer sonar.organization ci-dessous par la clé d'organisation réelle

sonar.projectKey=cocfet-backend
sonar.organization=cocfet
sonar.projectName=COCFET Backend

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**,**/prisma/migrations/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
