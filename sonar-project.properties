# Analyse SonarCloud — https://sonarcloud.io/project/overview?id=etie-pick202_COCFET-BACKEND
# Activée par la variable de dépôt SONAR_ENABLED=true et le secret SONAR_TOKEN
# (Settings > Secrets and variables > Actions).

sonar.projectKey=etie-pick202_COCFET-BACKEND
sonar.organization=etie-pick202
sonar.projectName=COCFET Backend

sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,test/**/*
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**
sonar.sourceEncoding=UTF-8

# Exclu de la *couverture* uniquement, pas de l'analyse : ces fichiers restent
# audités pour les vulnérabilités et les code smells, mais ne sont pas comptés
# dans le ratio de tests. Ce sont des déclarations (décorateurs, mapping ORM,
# constantes) sans logique à éprouver — les inclure diluerait la couverture
# réelle des services critiques.
# data-source.ts est un objet de configuration consomme par le CLI TypeORM :
# il ne contient aucune logique a eprouver.
# openapi.ts est un script de ligne de commande, au meme titre que seed/ : il
# amorce l'application et ecrit un fichier. Ce qu'il produit — la construction
# du document — vit dans swagger.ts, qui lui est couvert par swagger.spec.ts.
sonar.coverage.exclusions=**/*.module.ts,**/*.dto.ts,**/*.entity.ts,**/*.enum.ts,**/*.decorator.ts,**/*constants.ts,**/main.ts,**/*.config.ts,**/migrations/**,**/data-source.ts,**/seed/**,**/openapi.ts

# Les migrations sont du SQL genere par TypeORM : repetitif par nature et sans
# logique a tester. Les mesurer fausserait couverture comme duplication.
sonar.cpd.exclusions=**/migrations/**

# Deux rapports : les tests unitaires et les tests end-to-end. Ces derniers
# couvrent des garanties qu'un depot simule ne peut pas verifier (usage unique
# d'un jeton, concurrence). Les ignorer sous-estimerait la couverture reelle et
# pousserait a ecrire des tests mockes sans valeur pour atteindre le seuil.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-e2e/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# S2699 « Add at least one assertion to this test case » sur les tests
# end-to-end. `.expect(403)` de supertest est une assertion — elle leve quand le
# statut differe — mais Sonar ne reconnait que `expect()` de Jest. La meme regle
# est desactivee cote ESLint, avec la meme justification.
sonar.issue.ignore.multicriteria=e2eAssertions,nommageCatch
sonar.issue.ignore.multicriteria.e2eAssertions.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.e2eAssertions.resourceKey=test/**/*.e2e-spec.ts

# S7718 exige que le parametre d'un bloc catch s'appelle « error_ ». Ce code est
# ecrit en francais de bout en bout — variables, methodes, commentaires — et
# « erreur » y est le nom juste. Renommer sept occurrences pour satisfaire une
# convention anglophone introduirait un mot isole, sans rien corriger : la regle
# ne signale aucun risque de defaut, seulement une preference de nommage.
#
# Ce que l'on perd : si un parametre de catch etait reellement mal nomme —
# « e », « x » — l'analyseur ne le dirait plus. Le compromis est assume, la
# relecture couvrant deja ce genre de choix.
sonar.issue.ignore.multicriteria.nommageCatch.ruleKey=typescript:S7718
sonar.issue.ignore.multicriteria.nommageCatch.resourceKey=**/*.ts
