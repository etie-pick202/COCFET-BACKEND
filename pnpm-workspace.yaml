# Depuis pnpm 11, ces réglages ne sont plus lus depuis package.json.

# bcrypt et unrs-resolver sont des modules natifs : leur script de build est
# nécessaire. @scarf/scarf n'est que de la télémétrie, on l'ignore.
allowBuilds:
  '@scarf/scarf': false
  bcrypt: true
  unrs-resolver: true

# Le delai de carence bloque les versions publiees depuis moins de 7 jours.
# Ces correctifs de securite doivent etre adoptes sans attendre.
minimumReleaseAgeExclude:
  - proxy-addr@2.0.8
  - source-map-js@1.2.2
  - qs@6.16.0
  - postcss-selector-parser@7.1.6
  - js-yaml@5.4.1
  - js-yaml@5.4.2
  - js-yaml@5.4.3
  - brace-expansion@1.1.18
  - brace-expansion@2.1.4
  - brace-expansion@5.0.9
  - fast-uri@3.1.5
  - nanoid@3.3.18

# CVE dans des dépendances transitives que nous ne contrôlons pas directement
# (principalement via l'arbre mjml de @nestjs-modules/mailer). On force les
# versions corrigées. À réévaluer quand les paquets parents auront été mis à
# jour en amont.
overrides:
  # Failles hautes (GHSA-v53p-9fqp-m79j, GHSA-prgh-xp8r-p3m5) sur la branche 9 :
  # aucun correctif n'y est publie, ils ne le sont qu'a partir de la 10.0.9.
  # Le passage a la v10 est donc imposé. Il est sans risque pour
  # @nestjs-modules/mailer, dont le pair accepte « >=8.0.5 », et le code
  # n'importe jamais nodemailer directement : il ne l'atteint que par lui.
  # Borne haute explicite : la v11 ne serait ni eprouvee ni demandee.
  nodemailer: '>=10.0.9 <11.0.0'
  # undici : deni de service (GHSA-rfgv-xxqx-mfg5). Remonte par cheerio, dans
  # l'arbre mjml de @nestjs-modules/mailer — donc au rendu des emails.
  # Borne haute : cheerio attend la branche 6.
  undici: '>=6.28.1 <7.0.0'
  tar: '>=7.5.19'
  linkify-it: '>=5.0.2'
  # js-yaml : le plafond de fusions de cles (maxTotalMergeKeys) n'empeche pas
  # l'epuisement du processeur sur des sources de fusion vides
  # (GHSA-r3ph-w7gj-g6xm). Remonte par cosmiconfig, dans l'arbre mjml.
  js-yaml: '>=5.4.1'
  # proxy-addr : usurpation d'adresse IP par un sous-reseau de confiance
  # exprime en IPv4 mappe en IPv6 (GHSA-jqcg-44mw-7w3h, critique). Remonte par
  # express — donc sur chaque requete. La 2.0.8 est un correctif de la meme
  # branche que celle qu'express demande (~2.0.7).
  proxy-addr: '>=2.0.8 <3.0.0'
  # source-map-js : deni de service de la boucle d'evenements par des decalages
  # de section d'un index de source map (GHSA-68fv-2mgg-jv7q, haute). Remonte
  # par postcss, dans l'arbre mjml — donc au rendu des emails.
  source-map-js: '>=1.2.2 <2.0.0'
  # qs : deux avis de deni de service (GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g).
  # Remonte par body-parser, via express. Meme branche 6, borne haute explicite.
  qs: '>=6.16.0 <7.0.0'
  # postcss-selector-parser : complexite quadratique a l'analyse d'un selecteur
  # plat (GHSA-rj75-hqrm-r3gf). Remonte par cssnano, dans l'arbre mjml. Scope a
  # la branche 7, la seule installee ici.
  postcss-selector-parser@^7.0.0: '>=7.1.6 <8.0.0'
  # multer : deni de service par nom de champ ou index de tableau surdimensionne,
  # et fuite de descripteur de fichier sur un televersement interrompu. Remonte
  # par @nestjs/platform-express — donc sur chaque route qui accepte un fichier.
  multer: '>=2.3.0'
  # svgo : « removeScripts » laissait passer des liens executables par
  # contournement de l'espace de noms. Remonte par l'arbre mjml de
  # @nestjs-modules/mailer, au rendu des emails — jamais applique a un SVG
  # televerse par un utilisateur ici, mais autant fermer la faille.
  svgo: '>=4.1.0'
  # Versions EXACTES et non des plages ouvertes : « >=1.1.18 » resoudrait vers
  # la 5.x, la plus recente qui satisfait la contrainte. Or forcer la v5 sur
  # minimatch@3, dont l'API attend la v1 (export par defaut), casse ESLint.
  # Chaque branche majeure doit donc rester sur son propre correctif.
  brace-expansion@^1.1.7: '1.1.21'
  brace-expansion@^2.0.1: '2.1.7'
  brace-expansion@^5.0.0: '5.0.12'
  # fast-uri : remonte par ajv, via le CLI NestJS et les schematics Angular —
  # outillage de developpement, jamais charge en production.
  # « >=3.1.5 » couvrait encore la fenetre vulnerable 4.0.0-4.1.2 : ajv ne
  # resout plus que la branche v4 ici, la contrainte se resserre donc sur son
  # correctif au lieu de rester sur le plancher v3 devenu sans objet.
  fast-uri: '>=4.1.3'
  # uuid : controle de bornes manquant sur le parametre buf des versions
  # v3/v5/v6 (GHSA, gravite moyenne). Remonte par l'arbre de Cucumber, donc
  # outillage de test uniquement. L'override est scope a la branche v11 : la
  # v10 repond a une contrainte differente et forcer un changement de majeure
  # casserait @cucumber/messages@26.
  uuid@^11.0.0: '>=11.1.1'
  # nanoid : un generateur personnalise recevant une taille nulle boucle
  # indefiniment (GHSA-2v37-7h3g-55p8). Remonte par postcss, dans l'arbre mjml
  # de @nestjs-modules/mailer — donc au rendu des emails.
  # Version EXACTE, et scope a la branche v3 que postcss demande (^3.3.16) :
  # « >=3.3.17 » resout vers la 6.x — verifie — qui est ESM pur et que
  # postcss, en CommonJS, ne sait pas charger.
  nanoid@^3.3.16: '3.3.18'

# GHSA-mh99-v99m-4gvg (CVE-2026-14257, brace-expansion) : l'avis déclare
# « vulnérable <=5.0.7 », ce qui marque à tort les rétroportages 1.1.17 et
# 2.1.3 comme vulnérables. Ces deux versions contiennent bien le correctif
# (garde EXPANSION_MAX_LENGTH, vérifié dans leur code). Forcer la v5 partout
# n'est pas une option : son API a changé et casse minimatch@3, dont dépend
# ESLint. On ignore donc cet avis, les versions installées étant corrigées.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
    # braces <= 3.0.3 : epuisement de pile par motifs profondement imbriques
    # (GHSA-vfj7-8cjw-p6xm, publie le 2026-09-18). AUCUN correctif n'existe : la
    # derniere version publiee est la 3.0.3, et l'avis ne cite aucune version
    # corrigee (« >=3.0.4 » n'est qu'un plancher theorique de l'outil d'audit).
    # Un override est donc impossible. Remonte par lint-staged > micromatch :
    # outillage de developpement, qui n'expanse que les noms de fichiers de nos
    # propres commits — jamais charge en production. A retirer des qu'une
    # version corrigee paraitra.
    - GHSA-vfj7-8cjw-p6xm
