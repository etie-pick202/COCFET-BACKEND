# Depuis pnpm 11, ces réglages ne sont plus lus depuis package.json.

# bcrypt et unrs-resolver sont des modules natifs : leur script de build est
# nécessaire. @scarf/scarf n'est que de la télémétrie, on l'ignore.
allowBuilds:
  '@scarf/scarf': false
  bcrypt: true
  unrs-resolver: true

# Le delai de carence bloque les versions publiees depuis moins de 7 jours.
# Ces correctifs de securite doivent etre adoptes sans attendre.
minimumReleaseAgeExclude:
  - brace-expansion@1.1.18
  - brace-expansion@2.1.4
  - brace-expansion@5.0.9
  - fast-uri@3.1.5
  - nanoid@3.3.18

# CVE dans des dépendances transitives que nous ne contrôlons pas directement
# (principalement via l'arbre mjml de @nestjs-modules/mailer). On force les
# versions corrigées. À réévaluer quand les paquets parents auront été mis à
# jour en amont.
overrides:
  nodemailer: '>=9.0.1'
  tar: '>=7.5.19'
  linkify-it: '>=5.0.2'
  js-yaml: '>=5.2.2'
  # Versions EXACTES et non des plages ouvertes : « >=1.1.18 » resoudrait vers
  # la 5.x, la plus recente qui satisfait la contrainte. Or forcer la v5 sur
  # minimatch@3, dont l'API attend la v1 (export par defaut), casse ESLint.
  # Chaque branche majeure doit donc rester sur son propre correctif.
  brace-expansion@^1.1.7: '1.1.18'
  brace-expansion@^2.0.1: '2.1.4'
  brace-expansion@^5.0.0: '5.0.9'
  # fast-uri : remonte par ajv, via le CLI NestJS et les schematics Angular.
  fast-uri: '>=3.1.5'
  # uuid : controle de bornes manquant sur le parametre buf des versions
  # v3/v5/v6 (GHSA, gravite moyenne). Remonte par l'arbre de Cucumber, donc
  # outillage de test uniquement. L'override est scope a la branche v11 : la
  # v10 repond a une contrainte differente et forcer un changement de majeure
  # casserait @cucumber/messages@26.
  uuid@^11.0.0: '>=11.1.1'
  # nanoid : un generateur personnalise recevant une taille nulle boucle
  # indefiniment (GHSA-2v37-7h3g-55p8). Remonte par postcss, dans l'arbre mjml
  # de @nestjs-modules/mailer — donc au rendu des emails.
  # Version EXACTE, et scope a la branche v3 que postcss demande (^3.3.16) :
  # « >=3.3.17 » resout vers la 6.x — verifie — qui est ESM pur et que
  # postcss, en CommonJS, ne sait pas charger.
  nanoid@^3.3.16: '3.3.18'

# GHSA-mh99-v99m-4gvg (CVE-2026-14257, brace-expansion) : l'avis déclare
# « vulnérable <=5.0.7 », ce qui marque à tort les rétroportages 1.1.17 et
# 2.1.3 comme vulnérables. Ces deux versions contiennent bien le correctif
# (garde EXPANSION_MAX_LENGTH, vérifié dans leur code). Forcer la v5 partout
# n'est pas une option : son API a changé et casse minimatch@3, dont dépend
# ESLint. On ignore donc cet avis, les versions installées étant corrigées.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
