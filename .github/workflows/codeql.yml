name: CodeQL

# Analyse statique de sécurité (SAST) : détecte injections SQL, XSS, secrets
# codés en dur, chemins non assainis. Gratuit sur les dépôts publics et ne
# demande aucun compte externe — les résultats remontent dans l'onglet Security.

on:
  pull_request:
    # `feat/**` est inclus pour les PR empilees : une branche ouverte sur une
    # autre branche de fonctionnalite, le temps que la premiere soit mergee.
    # Sans cela ces PR n'ont aucune verification, et arrivent en revue sans
    # qu'on sache si elles compilent.
    branches: [main, develop, staging, 'feat/**']
  push:
    branches: [main, develop]
  schedule:
    # Une analyse hebdomadaire attrape les vulnérabilités publiées après le merge.
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyse CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript
          # security-extended ajoute les règles de sévérité moyenne aux règles
          # par défaut, qui ne couvrent que les vulnérabilités à forte confiance.
          queries: security-extended

      - name: Analyser
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: '/language:javascript-typescript'
