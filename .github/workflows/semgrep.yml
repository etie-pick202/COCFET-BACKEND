name: Semgrep

# Complément à CodeQL, pas doublon : les jeux de règles publics couvrent OWASP
# et les secrets codés en dur, tandis que .semgrep/cocfet.yml encode nos
# invariants métier (montants entiers, signature de webhook, SQL concaténé)
# que CodeQL ne peut pas deviner.
#
# Aucun compte ni token : `semgrep scan` fonctionne sans la plateforme Semgrep
# Cloud, contrairement à `semgrep ci`.

on:
  pull_request:
    branches: [main, develop, staging]
  push:
    branches: [main, develop]

jobs:
  semgrep:
    name: Analyse Semgrep
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Installer Semgrep
        run: pip install semgrep==1.172.0

      - name: Analyser
        # Le scan ne fait pas échouer le job ici : le SARIF doit d'abord être
        # produit, lu et publié. La décision d'échec revient à l'étape finale.
        continue-on-error: true
        run: |
          semgrep scan \
            --config=p/typescript \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --config=.semgrep/ \
            --sarif --output=semgrep.sarif \
            --metrics=off

      - name: Détailler les résultats
        # Sans cette étape, un échec n'indique pas ce qui a été trouvé :
        # le SARIF part dans un fichier et n'apparaît nulle part dans le log.
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("semgrep.sarif")) {
              console.log("Aucun rapport produit — le scan a échoué avant de rendre la main.");
              process.exit(0);
            }
            const sarif = JSON.parse(fs.readFileSync("semgrep.sarif", "utf8"));
            const run = sarif.runs[0];
            const gravite = Object.fromEntries(
              (run.tool.driver.rules || []).map((r) => [r.id, r.defaultConfiguration?.level || "warning"]),
            );
            const resultats = run.results || [];
            if (!resultats.length) {
              console.log("Aucun problème détecté.");
              process.exit(0);
            }
            let bloquants = 0;
            for (const r of resultats) {
              const niveau = gravite[r.ruleId] || "warning";
              if (niveau === "error") bloquants++;
              const loc = r.locations[0].physicalLocation;
              console.log(
                `[${niveau.toUpperCase()}] ${r.ruleId}\n` +
                  `  ${loc.artifactLocation.uri}:${loc.region.startLine}\n` +
                  `  ${(r.message.text || "").split("\n")[0]}\n`,
              );
            }
            console.log(`${resultats.length} problème(s), dont ${bloquants} bloquant(s).`);
            fs.appendFileSync(process.env.GITHUB_ENV, `SEMGREP_BLOQUANTS=${bloquants}\n`);
          '

      - name: Publier les résultats dans l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Échouer si un problème bloquant subsiste
        if: always()
        run: |
          if [ "${SEMGREP_BLOQUANTS:-0}" -gt 0 ]; then
            echo "::error::${SEMGREP_BLOQUANTS} problème(s) de sévérité ERROR — voir le détail plus haut."
            exit 1
          fi
