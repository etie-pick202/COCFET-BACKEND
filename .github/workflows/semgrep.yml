name: Semgrep

# Complément à CodeQL, pas doublon : les jeux de règles publics couvrent OWASP
# et les secrets codés en dur, tandis que .semgrep/cocfet.yml encode nos
# invariants métier (montants entiers, signature de webhook, SQL concaténé)
# que CodeQL ne peut pas deviner.
#
# Aucun compte ni token : `semgrep scan` fonctionne sans la plateforme Semgrep
# Cloud, contrairement à `semgrep ci`.

on:
  pull_request:
    branches: [main, develop, staging]
  push:
    branches: [main, develop]

jobs:
  semgrep:
    name: Analyse Semgrep
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Installer Semgrep
        run: pip install semgrep==1.172.0

      - name: Analyser
        # --error fait échouer le job sur toute règle de sévérité ERROR.
        run: |
          semgrep scan \
            --config=p/typescript \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --config=.semgrep/ \
            --sarif --output=semgrep.sarif \
            --error \
            --metrics=off

      - name: Publier les résultats dans l'onglet Security
        # Exécuté même en cas d'échec, sinon les alertes détectées seraient perdues.
        if: always()
        uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
