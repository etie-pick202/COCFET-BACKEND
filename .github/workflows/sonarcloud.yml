name: SonarCloud

# Prérequis pour activer ce workflow :
#   1. Créer le projet sur https://sonarcloud.io et récupérer le token.
#   2. Ajouter le secret SONAR_TOKEN     (Settings > Secrets and variables > Actions > Secrets).
#   3. Ajouter la variable SONAR_ENABLED = true  (même page, onglet Variables).
# Tant que SONAR_ENABLED n'est pas défini, le job est ignoré au lieu d'échouer.

on:
  pull_request:
    # `feat/**` est inclus pour les PR empilees : une branche ouverte sur une
    # autre branche de fonctionnalite, le temps que la premiere soit mergee.
    # Sans cela ces PR n'ont aucune verification, et arrivent en revue sans
    # qu'on sache si elles compilent.
    branches: [main, develop, staging, 'feat/**']
  push:
    branches: [main, develop]

jobs:
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    # Les PR de Dependabot sont exclues : GitHub leur refuse délibérément l'accès
    # aux secrets Actions, pour qu'une mise à jour de dépendance malveillante ne
    # puisse pas les exfiltrer. SONAR_TOKEN y est donc vide et l'analyse échoue
    # systématiquement. Ces PR ne modifient que des versions de dépendances, et
    # restent couvertes par les treize autres vérifications.
    if: ${{ vars.SONAR_ENABLED == 'true' && github.actor != 'dependabot[bot]' }}
    services:
      # Les tests end-to-end couvrent des garanties qu'aucun dépôt simulé ne
      # peut vérifier — usage unique d'un jeton, comportement sous concurrence.
      # Sans base ici, leur couverture serait perdue et le seuil pousserait à
      # écrire des tests mockés sans valeur pour l'atteindre.
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cocfet
          POSTGRES_PASSWORD: cocfet
          POSTGRES_DB: cocfet_sonar
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cocfet"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://cocfet:cocfet@localhost:5432/cocfet_sonar
      # Longueur imposee par env.validation : HS256 ne vaut que ce que vaut le
      # secret. Ces deux valeurs sont publiques et ne servent qu'a la CI, sur
      # une base jetable ; elles doivent surtout etre differentes l'une de
      # l'autre, sans quoi la validation echoue — comme en production.
      JWT_ACCESS_SECRET: cle-de-ci-pour-jeton-d-acces-sans-valeur-reelle
      JWT_REFRESH_SECRET: cle-de-ci-pour-jeton-de-rafraichissement-distincte
      MAIL_HOST: smtp.example.com
      MAIL_USER: ci
      MAIL_PASSWORD: ci
      # Variables R2_* volontairement absentes : le stockage local prend le
      # relais, et la CI eprouve donc l'adaptateur que toute l'equipe utilise.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:cov
        continue-on-error: true
      - run: pnpm run test:e2e:cov
        continue-on-error: true
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
