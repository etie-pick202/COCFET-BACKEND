name: SonarCloud

# Prérequis pour activer ce workflow :
#   1. Créer le projet sur https://sonarcloud.io et récupérer le token.
#   2. Ajouter le secret SONAR_TOKEN     (Settings > Secrets and variables > Actions > Secrets).
#   3. Ajouter la variable SONAR_ENABLED = true  (même page, onglet Variables).
# Tant que SONAR_ENABLED n'est pas défini, le job est ignoré au lieu d'échouer.

on:
  pull_request:
    branches: [main, develop, staging]
  push:
    branches: [main, develop]

jobs:
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:cov
        continue-on-error: true
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
