# Surveillance des mises à jour de sécurité.
# Les correctifs de sécurité remontent quel que soit le regroupement ci-dessous.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Sans cette directive, Dependabot cible la branche par défaut (main) et
    # court-circuite le flux develop -> staging -> main : une mise à jour
    # arriverait en production sans passer par l'intégration ni la recette.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    # Délai de carence : on n'adopte pas une version publiée il y a moins de
    # 7 jours. C'est la fenêtre pendant laquelle une compromission de paquet
    # (prise de contrôle d'un mainteneur, publication malveillante) est
    # habituellement détectée et retirée.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    labels:
      - infra
    # Les montées de version majeures sont écartées : elles demandent un arbitrage
    # manuel et noieraient les correctifs de sécurité dans le bruit.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    # Regroupées en une seule PR par famille, pour éviter d'ouvrir dix PR par semaine.
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      typeorm:
        patterns: ['typeorm', '@nestjs/typeorm', 'pg']
      tests:
        patterns: ['jest', 'ts-jest', '@types/jest', 'supertest', '@cucumber/*']
      lint:
        patterns: ['eslint*', 'prettier', 'typescript-eslint', '@eslint/*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    # codeql-action expose plusieurs points d'entrée (init, analyze,
    # upload-sarif) qui doivent impérativement rester à la même version : un
    # écart entre init et analyze fait échouer l'analyse. Sans ce regroupement,
    # Dependabot ouvre une PR par point d'entrée, dont chacune casse la CI
    # isolément.
    groups:
      codeql:
        patterns: ['github/codeql-action*']
      actions-officielles:
        patterns: ['actions/*']
    # Délai de carence : on n'adopte pas une version publiée il y a moins de
    # 7 jours. C'est la fenêtre pendant laquelle une compromission de paquet
    # (prise de contrôle d'un mainteneur, publication malveillante) est
    # habituellement détectée et retirée.
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci(actions)'
    labels:
      - infra
