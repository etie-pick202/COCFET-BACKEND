# Reverse proxy de la VPS : seul service exposé sur Internet.
#
# Projet Compose à part, démarré une fois et laissé en place : il ne dépend
# d'aucun environnement, et redéployer la production ne coupe pas la recette.
# Il crée le réseau cocfet-edge, que les environnements rejoignent.

name: cocfet-edge

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      # HTTP/3.
      - '443:443/udp'
    env_file: ./.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificats et comptes ACME : les perdre ferait redemander des
      # certificats à chaque redémarrage, jusqu'à la limite de Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge

networks:
  edge:
    name: cocfet-edge

volumes:
  caddy-data: {}
  caddy-config: {}
